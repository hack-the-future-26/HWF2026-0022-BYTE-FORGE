spring.application.name=titleverify-ai

spring.datasource.url=jdbc:postgresql://localhost:5432/titleverify_ai
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Semantic Embedding Configuration
titleverify.embedding.provider=gemini
titleverify.embedding.model=gemini-embedding-001

# Rule Engine Configuration
titleverify.rules.prohibited-words=police,crime,corruption,cbi,cid,army
titleverify.rules.periodicity-modifiers=daily,weekly,fortnightly,monthly,biweekly,bimonthly,quarterly,annual,yearly,evening,morning,express,gazette,bulletin
titleverify.rules.prefixes=the,a,an,shree,shri,new,latest,subh,real,super,prime,grand
titleverify.rules.suffixes=news,times,post,today,now,herald,standard,live,media,chronicle,press,journal,samachar,khabar,patrikar

# Risk Scoring Engine Configuration (Development scoring — not official PRGI criteria)
titleverify.scoring.weight.exact-match=100.0
titleverify.scoring.weight.fuzzy=30.0
titleverify.scoring.weight.phonetic=25.0
titleverify.scoring.weight.semantic=25.0
titleverify.scoring.rule-penalty.high=40.0
titleverify.scoring.rule-penalty.warning=15.0
titleverify.scoring.rule-penalty.info=0.0

# Decision Engine Configuration (Development thresholds — not official PRGI criteria)
titleverify.decision.threshold.accept=40.0
titleverify.decision.threshold.high-risk=70.0